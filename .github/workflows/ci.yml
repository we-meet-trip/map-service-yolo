# 되돌리기 어려운 사고를 사람 손보다 먼저 잡는 자리.
#
# 왜 두는가: 시험 스택을 늘 띄워 두는 것보다 싸고 확실하다. 사람은 "먼저
# 돌려 보기" 를 잊지만 여기는 잊지 않는다. 개발 기계의 메모리도 쓰지 않는다.
#
# 판을 박아 두는 이유: 이 서비스의 Dockerfile 이 python 3.12 로 고정돼 있다.
# 여기서 다른 판으로 돌리면, 통과한 것이 배포에서 깨질 수 있다.
#
# 이 서비스는 인식 모델을 함께 들고 다녀 받는 것이 무겁다. 그래도 이미지를
# 만드는 자리에서만 보면 늦다 — 그때는 이미 네 서비스를 함께 만들고 있다.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# 같은 곳에 연달아 밀면 앞의 실행은 접는다. 마지막 것만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 잠금 파일이 없어 매번 새로 받는다. 캐시는 받은 것을 다시 쓸 뿐 판을
      # 고정하지 않으므로, 의존성이 조용히 올라가면 여기서 먼저 드러난다.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: test
        run: pytest -q
